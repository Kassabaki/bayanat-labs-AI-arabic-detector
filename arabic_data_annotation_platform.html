<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ترميز البيانات العربية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-indigo-600/20 text-indigo-400 rounded-lg border border-indigo-500/30">
                    <i data-lucide="tag" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white">منصة ترميز البيانات العربية</h1>
                    <p class="text-xs text-slate-400">نظام التصنيف وإعادة صياغة النصوص للنصوص العربية</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg border border-slate-700 text-sm font-medium transition flex items-center gap-2">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    <span>استيراد JSON</span>
                    <input type="file" id="importInput" accept=".json" class="hidden" onchange="importData(event)">
                </label>
                <button onclick="exportData()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium text-sm transition flex items-center gap-2 shadow-lg shadow-indigo-600/20">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    <span>تصدير البيانات (JSON)</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Sidebar Navigation -->
        <aside class="lg:col-span-4 bg-slate-950/40 border border-slate-800 rounded-xl p-4 flex flex-col h-[calc(100vh-8rem)]">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                <span class="text-sm font-semibold text-slate-300">قائمة النصوص (<span id="totalCount">0</span>)</span>
                <span class="text-xs text-slate-400 bg-slate-800 px-2 py-1 rounded-full" id="progressStatus">مكتمل: 0/0</span>
            </div>

            <div id="sampleList" class="flex-1 overflow-y-auto space-y-2 pr-1">
                <!-- Dynamically populated sample items -->
            </div>
        </aside>

        <!-- Annotation Workspace -->
        <section class="lg:col-span-8 bg-slate-950/40 border border-slate-800 rounded-xl p-6 flex flex-col justify-between">
            <div class="space-y-6">
                <!-- Item Header & Badge -->
                <div class="flex items-center justify-between border-b border-slate-800/80 pb-4">
                    <span id="itemIdBadge" class="text-xs font-mono text-indigo-400 bg-indigo-950/50 border border-indigo-800/50 px-2.5 py-1 rounded">ID: --</span>
                    <div id="statusBadge" class="text-xs font-medium px-2.5 py-1 rounded bg-slate-800 text-slate-400">غير مراجع</div>
                </div>

                <!-- Original Text Display -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">النص الأصلي</label>
                    <div id="originalText" class="p-4 bg-slate-900 border border-slate-800 rounded-xl text-lg leading-relaxed text-slate-200 min-h-[100px] select-text">
                        اختر نصاً من القائمة للبدء في الترميز...
                    </div>
                </div>

                <!-- Classification Options -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">التصنيف الرئيسي (Category)</label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <button onclick="setCategory('سؤال')" class="category-btn p-3 bg-slate-900 border border-slate-800 rounded-xl hover:border-indigo-500/50 text-sm font-medium transition text-center" data-cat="سؤال">سؤال</button>
                        <button onclick="setCategory('طلب')" class="category-btn p-3 bg-slate-900 border border-slate-800 rounded-xl hover:border-indigo-500/50 text-sm font-medium transition text-center" data-cat="طلب">طلب</button>
                        <button onclick="setCategory('خبر')" class="category-btn p-3 bg-slate-900 border border-slate-800 rounded-xl hover:border-indigo-500/50 text-sm font-medium transition text-center" data-cat="خبر">خبر</button>
                        <button onclick="setCategory('رأي')" class="category-btn p-3 bg-slate-900 border border-slate-800 rounded-xl hover:border-indigo-500/50 text-sm font-medium transition text-center" data-cat="رأي">رأي</button>
                    </div>
                </div>

                <!-- Paraphrase / Editing Section -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">إعادة الصياغة / النص المحسن</label>
                    <textarea id="rewrittenText" rows="3" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-slate-200 focus:outline-none focus:border-indigo-500 transition resize-none placeholder-slate-600" placeholder="أدخل الصياغة المحسنة هنا..."></textarea>
                </div>

                <!-- Quality Rating -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">تقييم الجودة</label>
                    <div class="flex items-center gap-2" id="ratingContainer">
                        <button onclick="setRating(1)" class="star-btn p-2 hover:text-amber-400 text-slate-600 transition" data-rate="1"><i data-lucide="star" class="w-6 h-6"></i></button>
                        <button onclick="setRating(2)" class="star-btn p-2 hover:text-amber-400 text-slate-600 transition" data-rate="2"><i data-lucide="star" class="w-6 h-6"></i></button>
                        <button onclick="setRating(3)" class="star-btn p-2 hover:text-amber-400 text-slate-600 transition" data-rate="3"><i data-lucide="star" class="w-6 h-6"></i></button>
                        <button onclick="setRating(4)" class="star-btn p-2 hover:text-amber-400 text-slate-600 transition" data-rate="4"><i data-lucide="star" class="w-6 h-6"></i></button>
                        <button onclick="setRating(5)" class="star-btn p-2 hover:text-amber-400 text-slate-600 transition" data-rate="5"><i data-lucide="star" class="w-6 h-6"></i></button>
                    </div>
                </div>
            </div>

            <!-- Footer Actions -->
            <div class="flex items-center justify-between border-t border-slate-800/80 pt-4 mt-6">
                <button onclick="previousSample()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm font-medium transition flex items-center gap-2">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    <span>السابق</span>
                </button>
                <button onclick="saveAndNext()" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-medium transition flex items-center gap-2 shadow-lg shadow-emerald-600/20">
                    <span>حفظ والتالي</span>
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
            </div>
        </section>

    </main>

    <script>
        // Default dataset
        let samples = [
            { id: "sample-101", text: "كيف يمكنني التسجيل في دورة الذكاء الاصطناعي الجديدة؟", category: "سؤال", rewritten: "ما هي خطوات التقديم على دورة الذكاء الاصطناعي؟", rating: 5, completed: true },
            { id: "sample-102", text: "أرجو إلغاء الطلب الخاص بي ورقم المرجعي هو 48392.", category: "طلب", rewritten: "", rating: 0, completed: false },
            { id: "sample-103", text: "تم اليوم توقيع اتفاقية تعاون بين الشركة والجامعة لتطوير حلول برمجة.", category: "خبر", rewritten: "", rating: 0, completed: false },
            { id: "sample-104", text: "التصميم الجديد للموقع ممتازا جداً ويسهل الوصول للخدمات.", category: "رأي", rewritten: "", rating: 0, completed: false }
        ];

        let currentIndex = 0;

        function init() {
            lucide.createIcons();
            renderSampleList();
            loadCurrentSample();
        }

        function renderSampleList() {
            const listEl = document.getElementById('sampleList');
            const totalCount = document.getElementById('totalCount');
            const progressStatus = document.getElementById('progressStatus');
            
            listEl.innerHTML = '';
            totalCount.innerText = samples.length;
            
            const completedCount = samples.filter(s => s.completed).length;
            progressStatus.innerText = `مكتمل: ${completedCount}/${samples.length}`;

            samples.forEach((sample, index) => {
                const item = document.createElement('div');
                item.onclick = () => selectSample(index);
                item.className = `p-3 rounded-lg cursor-pointer border transition flex items-center justify-between ${
                    index === currentIndex 
                        ? 'bg-indigo-950/60 border-indigo-500 text-slate-100' 
                        : 'bg-slate-900/40 border-slate-800/80 hover:bg-slate-900 text-slate-400'
                }`;
                
                item.innerHTML = `
                    <div class="truncate pl-2">
                        <div class="text-xs font-mono text-slate-500 mb-0.5">${sample.id}</div>
                        <div class="text-sm truncate">${sample.text}</div>
                    </div>
                    <div>
                        ${sample.completed 
                            ? '<span class="text-emerald-400 bg-emerald-950/40 p-1 rounded-full"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="5 13l4 4L19 7"></path></svg></span>' 
                            : '<span class="w-2 h-2 rounded-full bg-slate-700 block"></span>'
                        }
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function loadCurrentSample() {
            const current = samples[currentIndex];
            if (!current) return;

            document.getElementById('itemIdBadge').innerText = `ID: ${current.id}`;
            document.getElementById('originalText').innerText = current.text;
            document.getElementById('rewrittenText').value = current.rewritten || '';

            const statusBadge = document.getElementById('statusBadge');
            if (current.completed) {
                statusBadge.innerText = "مكتمل";
                statusBadge.className = "text-xs font-medium px-2.5 py-1 rounded bg-emerald-950/60 text-emerald-400 border border-emerald-800/50";
            } else {
                statusBadge.innerText = "قيد المراجعه";
                statusBadge.className = "text-xs font-medium px-2.5 py-1 rounded bg-amber-950/60 text-amber-400 border border-amber-800/50";
            }

            highlightCategory(current.category);
            highlightRating(current.rating);
            renderSampleList();
        }

        function selectSample(index) {
            saveCurrentState();
            currentIndex = index;
            loadCurrentSample();
        }

        function setCategory(category) {
            samples[currentIndex].category = category;
            highlightCategory(category);
        }

        function highlightCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === category) {
                    btn.className = "category-btn p-3 bg-indigo-600 border border-indigo-500 text-white rounded-xl text-sm font-medium transition text-center shadow-lg shadow-indigo-600/20";
                } else {
                    btn.className = "category-btn p-3 bg-slate-900 border border-slate-800 rounded-xl hover:border-indigo-500/50 text-sm font-medium transition text-center text-slate-300";
                }
            });
        }

        function setRating(rating) {
            samples[currentIndex].rating = rating;
            highlightRating(rating);
        }

        function highlightRating(rating) {
            document.querySelectorAll('.star-btn').forEach(btn => {
                const rateVal = parseInt(btn.getAttribute('data-rate'));
                if (rateVal <= rating) {
                    btn.className = "star-btn p-2 text-amber-400 transition";
                } else {
                    btn.className = "star-btn p-2 text-slate-600 hover:text-amber-400 transition";
                }
            });
        }

        function saveCurrentState() {
            if (!samples[currentIndex]) return;
            samples[currentIndex].rewritten = document.getElementById('rewrittenText').value;
            if (samples[currentIndex].category && samples[currentIndex].rating > 0) {
                samples[currentIndex].completed = true;
            }
        }

        function saveAndNext() {
            saveCurrentState();
            samples[currentIndex].completed = true;
            if (currentIndex < samples.length - 1) {
                currentIndex++;
            }
            loadCurrentSample();
        }

        function previousSample() {
            saveCurrentState();
            if (currentIndex > 0) {
                currentIndex--;
            }
            loadCurrentSample();
        }

        function exportData() {
            saveCurrentState();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(samples, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `arabic_dataset_annotated_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data) && data.length > 0) {
                        samples = data;
                        currentIndex = 0;
                        loadCurrentSample();
                    } else {
                        alert("ملف JSON غير صالح أو فارغ.");
                    }
                } catch (err) {
                    alert("تعذر قراءة ملف JSON.");
                }
            };
            reader.readAsText(file);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
